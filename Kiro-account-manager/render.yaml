databases:
  - name: kiro-db
    plan: free
    databaseName: kiro
    user: kiro

services:
  - type: web
    name: kiro-proxy-server
    rootDir: Kiro-account-manager
    runtime: node
    buildCommand: "npm install && npm run build:server"
    startCommand: npm run start:server
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: "0.0.0.0"
      - key: PROXY_API_KEY
        generateValue: true
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: kiro-db
          property: connectionString
