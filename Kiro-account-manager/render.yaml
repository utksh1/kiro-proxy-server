services:
  - type: web
    name: kiro-proxy-server
    runtime: node
    buildCommand: "npm install && npm run build:server"
    startCommand: npm run start:server
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: "0.0.0.0"
      - key: PROXY_API_KEY
        generateValue: true
      - key: NODE_VERSION
        value: "20"
